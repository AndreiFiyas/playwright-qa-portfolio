<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DocFlow — Sign in</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <form class="card" data-qa="loginForm" novalidate>
      <h1>Sign in</h1>
      <label>Email <input data-qa="emailInput" name="email" type="email" autocomplete="username" /></label>
      <label>Password <input data-qa="passwordInput" name="password" type="password" autocomplete="current-password" /></label>
      <p class="error" data-qa="loginError" role="alert" hidden>Wrong email or password</p>
      <button data-qa="signInButton" type="submit">Sign in</button>
    </form>
    <script type="module">
      const form = document.querySelector('[data-qa="loginForm"]');
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const data = Object.fromEntries(new FormData(form));
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(data),
        });
        if (!response.ok) {
          document.querySelector('[data-qa="loginError"]').hidden = false;
          return;
        }
        const { token } = await response.json();
        document.cookie = `session=${token}; path=/; SameSite=Lax`;
        location.assign('/');
      });
    </script>
  </body>
</html>
